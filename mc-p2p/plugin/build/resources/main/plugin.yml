name: Ezp
version: '1.0.0'
main: io.ezp.plugin.EzpPlugin
api-version: '1.20'
authors: [ezmc]
description: 基于 ez-mc / EasyTier 的 P2P 联机自动开房与地址广播插件
commands:
  ezp:
    description: ez-mc P2P 联机控制
    usage: /ezp <status|broadcast|room|stop|reload>
    permission: ezp.admin
permissions:
  ezp.admin:
    description: 允许使用 /ezp 命令
    default: op